# Levanta la API y el tablero juntos:  docker compose up --build
#   API:      http://localhost:8001/docs
#   Tablero:  http://localhost:8050
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: precios-api
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  tablero:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: precios-tablero
    ports:
      - "8050:8050"
    environment:
      # dentro de la red de compose, la API se llama "api"
      API_URL: http://api:8001/api/v1/predict
    depends_on:
      api:
        condition: service_healthy
