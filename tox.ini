# Como en los Talleres 5 y 6: tox crea un ambiente aislado e instala solo lo necesario.
#   tox run -e test      -> regenera el modelo del tablero y corre las pruebas
[tox]
envlist = test
skipsdist = True

[testenv:test]
deps =
    pandas
    numpy
    scikit-learn
    joblib
    pytest
commands =
    python src/preparar_tablero.py
    pytest tests -v
